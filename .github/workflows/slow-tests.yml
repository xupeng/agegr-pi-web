name: Slow tests

on:
  push:
    branches: [main, personal]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # This entry is usable only after the workflow exists on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR, push and manual events cannot cancel one another, even for the same ref.
  group: slow-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record checked-out revision
        run: echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Prepare owned runtime tree
        run: |
          root=$(/usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs prepare "$RUNNER_TEMP")
          printf 'CI_RUNTIME_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
      - name: Install dependencies
        id: install
        run: exec /usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs install "$CI_RUNTIME_ROOT" "$RUNNER_TEMP"
      - name: Install Chromium
        id: browser
        run: exec /usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs browser "$CI_RUNTIME_ROOT" "$RUNNER_TEMP"
      - name: Build
        id: build
        run: exec /usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs build "$CI_RUNTIME_ROOT" "$RUNNER_TEMP"
      - name: e2e/run.mjs (start)
        id: run
        run: exec /usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs run "$CI_RUNTIME_ROOT" "$RUNNER_TEMP"
      - name: e2e/subagents.mjs (dev)
        id: subagents
        # Keep independent subagent evidence after a main-suite failure, but
        # never start it after a failed build or a cancellation.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: exec /usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs subagents "$CI_RUNTIME_ROOT" "$RUNNER_TEMP"
      - name: Clean owned runtime tree
        if: ${{ always() && env.CI_RUNTIME_ROOT != '' }}
        run: exec /usr/bin/env -i PATH="$PATH" node lib/ci-test-env.mjs cleanup "$CI_RUNTIME_ROOT" "$RUNNER_TEMP"
      - name: Upload failure artifacts
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: slow-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/e2e/
            test-results/e2e-subagents/
            test-results/ci/
          retention-days: 7
          if-no-files-found: warn
      - name: Summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CI_BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_RUN_OUTCOME: ${{ steps.run.outcome }}
          CI_SUBAGENTS_OUTCOME: ${{ steps.subagents.outcome }}
        run: |
          exec /usr/bin/env -i PATH="$PATH" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" HEAD_SHA="$HEAD_SHA" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            CI_JOB_STATUS="$CI_JOB_STATUS" CI_PR_HEAD_SHA="$CI_PR_HEAD_SHA" CI_PR_MERGE_SHA="$CI_PR_MERGE_SHA" \
            CI_BASE_SHA="$CI_BASE_SHA" CI_BASE_REF="$CI_BASE_REF" CI_INSTALL_OUTCOME="$CI_INSTALL_OUTCOME" \
            CI_BROWSER_OUTCOME="$CI_BROWSER_OUTCOME" CI_BUILD_OUTCOME="$CI_BUILD_OUTCOME" \
            CI_RUN_OUTCOME="$CI_RUN_OUTCOME" CI_SUBAGENTS_OUTCOME="$CI_SUBAGENTS_OUTCOME" \
            node lib/ci-test-env.mjs summary slow
